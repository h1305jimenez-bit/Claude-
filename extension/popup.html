<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #0d0d0d;
    }
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid #e5e5e5;
      color: #6b6b6b;
    }
    .badge.connected { border-color: #16a34a; color: #16a34a; background: #f0fdf4; }

    .section { padding: 14px 16px; }
    .section + .section { border-top: 1px solid #e5e5e5; }

    .label { font-size: 10px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .value { font-size: 13px; color: #0d0d0d; }
    .dimmed { color: #6b6b6b; }

    .portal-badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid #e5e5e5;
      background: #f9f9f9;
      color: #6b6b6b;
      margin-top: 4px;
    }
    .portal-badge.detected { border-color: #0d0d0d; color: #0d0d0d; background: #f0f0f0; }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
      text-align: center;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #0d0d0d; color: #fff; }
    .btn-outline { background: #fff; color: #0d0d0d; border: 1px solid #e5e5e5; }

    .setup-box { padding: 20px 16px; }
    .setup-box h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .setup-box p { font-size: 12px; color: #6b6b6b; line-height: 1.5; margin-bottom: 14px; }
    input.token-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: monospace;
      color: #0d0d0d;
      background: #f9f9f9;
    }
    input.token-input:focus { outline: none; border-color: #0d0d0d; }

    .status {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .status.info { background: #f0f9ff; color: #0284c7; border: 1px solid #bae6fd; display: block; }

    .field-preview {
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
      color: #6b6b6b;
    }
    .field-preview:last-child { border-bottom: none; }
    .field-preview .val { color: #0d0d0d; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">ApplyPilot</span>
    <span class="badge" id="connectionBadge">Not connected</span>
  </div>

  <!-- Setup view -->
  <div id="setupView" class="setup-box">
    <h2>Connect your account</h2>
    <p>Open ApplyPilot, go to <strong>Profile → Account</strong>, and click <strong>Copy extension token</strong>. Paste it below.</p>
    <input class="token-input" id="tokenInput" type="password" placeholder="Paste access token..." />
    <div id="apiRow" style="display:none; margin-bottom:10px;">
      <input class="token-input" id="apiInput" type="url" placeholder="App URL (e.g. https://yourapp.vercel.app)" style="margin-bottom:0; font-family:-apple-system,sans-serif;" />
      <p style="font-size:10px;color:#6b6b6b;margin-top:4px;">Open the ApplyPilot app in any tab and this fills automatically.</p>
    </div>
    <button class="btn btn-primary" id="connectBtn">Connect</button>
    <div class="status" id="setupStatus"></div>
  </div>

  <!-- Connected view -->
  <div id="connectedView" style="display:none">
    <div class="section">
      <div class="label">Signed in as</div>
      <div class="value" id="userName">—</div>
      <div class="dimmed" style="font-size:12px" id="userEmail">—</div>
    </div>

    <div class="section">
      <div class="label">Current page</div>
      <div id="portalName" class="value">Scanning...</div>
      <span class="portal-badge" id="portalBadge">Unknown portal</span>
    </div>

    <div class="section" id="fieldsPreview" style="display:none">
      <div class="label">Fields ready to fill</div>
      <div id="fieldsList"></div>
    </div>

    <div class="section">
      <button class="btn btn-primary" id="fillBtn" disabled>Detecting form...</button>
      <div class="status" id="fillStatus"></div>
      <button class="btn btn-outline" id="downloadCvBtn" style="margin-top:8px;display:none">&#8595; Download CV</button>
      <button class="btn btn-outline" id="disconnectBtn" style="margin-top:8px">Disconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
